spring:
  application:
    name: autovyn-app
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/autovyn}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  gcs:
    bucket: ${GCS_BUCKET:}
  pubsub:
    topic: ${PUBSUB_TOPIC:items}

server:
  port: ${PORT:8080}

