name: CI/CD Pipeline

on:
  push:
    branches:
      - dev
  workflow_dispatch:
    inputs:
      environment:
        description: 'Select environment to deploy (dev or prod)'
        required: true
        default: 'dev'
      image_tag:
        description: 'Custom image tag (optional, default = latest commit SHA)'
        required: false
        default: ''

permissions:
  contents: read
  id-token: write

jobs:
  build-and-push:
    name: Build Docker Image & Push to Artifact Registry
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: 17

    - name: Build Maven project
      working-directory: ./app
      run: mvn clean package -DskipTests

    - name: Authenticate to Google Cloud
      id: auth
      uses: google-github-actions/auth@v1
      with:
        workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
        service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

    - name: Configure Docker for Artifact Registry
      run: gcloud auth configure-docker ${{ secrets.REGION }}-docker.pkg.dev

    - name: Build Docker image
      working-directory: ./app
      run: |
        IMAGE_TAG=${{ github.event.inputs.image_tag || github.sha }}
        docker build -t ${{ secrets.REGION }}-docker.pkg.dev/${{ secrets.PROJECT_ID }}/${{ secrets.REPOSITORY }}/${{ env.IMAGE_NAME }}:${IMAGE_TAG::8} .

    - name: Push Docker image
      run: |
        IMAGE_TAG=${{ github.event.inputs.image_tag || github.sha }}
        docker push ${{ secrets.REGION }}-docker.pkg.dev/${{ secrets.PROJECT_ID }}/${{ secrets.REPOSITORY }}/${{ env.IMAGE_NAME }}:${IMAGE_TAG::8}

    - name: Set image tag output
      id: image
      run: echo "IMAGE_TAG=${{ github.event.inputs.image_tag || github.sha }}" >> $GITHUB_ENV

  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Authenticate to Google Cloud
      id: auth
      uses: google-github-actions/auth@v1
      with:
        workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
        service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

    - name: Get GKE credentials
      run: |
        gcloud container clusters get-credentials your-cluster-name --region ${{ secrets.REGION }} --project ${{ secrets.PROJECT_ID }}

    - name: Determine environment
      id: env
      run: |
        if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
          ENV=${{ github.event.inputs.environment }}
        elif [[ "${GITHUB_REF##*/}" == "develop" ]]; then
          ENV="dev"
        else
          ENV="unknown"
        fi
        echo "ENVIRONMENT=$ENV" >> $GITHUB_ENV

    - name: Update image tag in deployment
      run: |
        IMAGE_TAG=${{ env.IMAGE_TAG }}
        sed -i "s|image: .*|image: ${{ secrets.REGION }}-docker.pkg.dev/${{ secrets.PROJECT_ID }}/${{ secrets.REPOSITORY }}/${{ env.IMAGE_NAME }}:${IMAGE_TAG::8}|g" k8s/deployment.yaml

    - name: Apply Kubernetes manifests
      run: |
        kubectl apply -f k8s/namespace-${{ env.ENVIRONMENT }}.yaml
        kubectl apply -f k8s/configmap.yaml
        kubectl apply -f k8s/secret.yaml
        kubectl apply -f k8s/deployment.yaml
        kubectl apply -f k8s/service.yaml
        kubectl apply -f k8s/hpa.yaml
        kubectl apply -f k8s/pdb.yaml
        kubectl apply -f k8s/ingress.yaml
